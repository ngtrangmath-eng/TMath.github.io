<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TMATH SMART GATE – Giải Mã Cổng Thông Minh</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Be Vietnam Pro & Nunito cho tiếng Việt rõ nét, hiện đại -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary-blue: #0284c7;
      --deep-blue: #0f294a;
      --cyan-glow: #06b6d4;
      --teal-accent: #14b8a6;
      --amber-gold: #f59e0b;
      --orange-pop: #f97316;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: radial-gradient(circle at 15% 15%, #e0f7ff 0%, #bae6fd 35%, #e0f2fe 70%, #f0f9ff 100%);
      color: #0f172a;
      min-height: 100vh;
      overflow-x: hidden;
      margin: 0;
    }

    .font-display {
      font-family: 'Nunito', 'Be Vietnam Pro', sans-serif;
    }

    /* Nền lưới công nghệ STEM nhẹ nhàng */
    .tech-grid-bg {
      background-image:
        linear-gradient(rgba(2, 132, 199, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(2, 132, 199, 0.06) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Thẻ kính 3D nổi khối */
    .stem-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 14px 35px -8px rgba(14, 116, 144, 0.18),
        0 4px 12px -2px rgba(2, 132, 199, 0.08),
        inset 0 2px 0 rgba(255, 255, 255, 1);
    }

    /* Nút bấm 3D kiểu trò chơi */
    .btn-3d {
      position: relative;
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease, filter 0.14s ease;
      user-select: none;
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(3px);
    }
    .btn-3d-orange {
      background: linear-gradient(180deg, #fbbf24 0%, #f97316 100%);
      box-shadow: 0 6px 0 #c2410c, 0 12px 20px rgba(249, 115, 22, 0.35);
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(124, 45, 18, 0.45);
    }
    .btn-3d-orange:hover:not(:disabled) {
      filter: brightness(1.05);
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #c2410c, 0 16px 26px rgba(249, 115, 22, 0.42);
    }
    .btn-3d-orange:active:not(:disabled) {
      box-shadow: 0 2px 0 #c2410c, 0 4px 10px rgba(249, 115, 22, 0.3);
    }

    .btn-3d-blue {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      box-shadow: 0 6px 0 #0369a1, 0 12px 20px rgba(2, 132, 199, 0.32);
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(12, 74, 110, 0.4);
    }
    .btn-3d-blue:hover:not(:disabled) {
      filter: brightness(1.05);
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #0369a1, 0 16px 24px rgba(2, 132, 199, 0.38);
    }
    .btn-3d-blue:active:not(:disabled) {
      box-shadow: 0 2px 0 #0369a1, 0 4px 10px rgba(2, 132, 199, 0.25);
    }

    .btn-3d-teal {
      background: linear-gradient(180deg, #2dd4bf 0%, #0d9488 100%);
      box-shadow: 0 6px 0 #115e59, 0 12px 20px rgba(13, 148, 136, 0.32);
      color: #ffffff;
    }
    .btn-3d-teal:hover:not(:disabled) {
      filter: brightness(1.05);
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #115e59, 0 16px 24px rgba(13, 148, 136, 0.38);
    }

    /* Nút chọn đáp án */
    .option-btn {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 0 #cbd5e1, 0 6px 14px rgba(15, 23, 42, 0.06);
    }
    .option-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: #0ea5e9;
      background-color: #f0f9ff;
      box-shadow: 0 6px 0 #7dd3fc, 0 10px 18px rgba(14, 165, 233, 0.16);
    }
    .option-btn.correct {
      background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
      border-color: #10b981;
      box-shadow: 0 5px 0 #059669, 0 10px 20px rgba(16, 185, 129, 0.25);
    }
    .option-btn.wrong {
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
      border-color: #f97316;
      box-shadow: 0 4px 0 #ea580c;
      animation: shakeX 0.42s ease-in-out;
    }

    /* Chuyển cảnh mượt */
    .screen-enter {
      animation: fadeSlideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    /* Hoạt ảnh Robot TMath bay lơ lửng */
    @keyframes robotFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    .animate-robot-float {
      animation: robotFloat 3s ease-in-out infinite;
    }

    /* Hoạt ảnh xe ô tô tiến đến cổng */
    @keyframes carApproach {
      0% { transform: translateX(-160px); }
      100% { transform: translateX(0px); }
    }
    .car-approach {
      animation: carApproach 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Hoạt ảnh xe rung nhẹ động cơ đang nổ máy */
    @keyframes carIdle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-1.5px); }
    }
    .car-idle {
      animation: carIdle 0.45s ease-in-out infinite;
    }

    /* Sóng siêu âm phát ra từ cảm biến */
    @keyframes waveEmit {
      0% {
        opacity: 0;
        transform: translateX(0px) scale(0.7);
      }
      25% {
        opacity: 0.95;
      }
      100% {
        opacity: 0;
        transform: translateX(-125px) scale(1.35);
      }
    }
    .sonar-wave-1 {
      transform-box: fill-box;
      transform-origin: center;
      animation: waveEmit 2s linear infinite;
    }
    .sonar-wave-2 {
      transform-box: fill-box;
      transform-origin: center;
      animation: waveEmit 2s linear 0.65s infinite;
    }
    .sonar-wave-3 {
      transform-box: fill-box;
      transform-origin: center;
      animation: waveEmit 2s linear 1.3s infinite;
    }

    /* Sóng siêu âm phản xạ ngược lại cảm biến (Thử thách 3) */
    @keyframes waveReflect {
      0% {
        opacity: 0;
        transform: translateX(0px) scale(0.8);
      }
      25% {
        opacity: 0.95;
      }
      100% {
        opacity: 0;
        transform: translateX(125px) scale(1.25);
      }
    }
    .sonar-reflect-1 {
      transform-box: fill-box;
      transform-origin: center;
      animation: waveReflect 2s linear 1s infinite;
    }
    .sonar-reflect-2 {
      transform-box: fill-box;
      transform-origin: center;
      animation: waveReflect 2s linear 1.65s infinite;
    }

    /* Dòng tín hiệu chạy trên dây điện */
    @keyframes wireFlow {
      to {
        stroke-dashoffset: -40;
      }
    }
    .wire-active {
      stroke-dasharray: 8 6;
      animation: wireFlow 0.9s linear infinite;
    }

    /* Hiệu ứng phát sáng bộ phận khi mở khóa */
    @keyframes glowPulse {
      0%, 100% {
        filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.9)) drop-shadow(0 0 14px rgba(250, 204, 21, 0.65));
      }
      50% {
        filter: drop-shadow(0 0 14px rgba(14, 165, 233, 1)) drop-shadow(0 0 24px rgba(251, 146, 60, 0.95));
      }
    }
    .part-glow {
      animation: glowPulse 1.6s ease-in-out infinite;
    }

    /* Dấu hỏi lớn phát sáng */
    @keyframes questionPulse {
      0%, 100% {
        transform: scale(1) rotate(-3deg);
        box-shadow: 0 0 22px rgba(245, 158, 11, 0.55), 0 0 45px rgba(6, 182, 212, 0.35);
      }
      50% {
        transform: scale(1.1) rotate(3deg);
        box-shadow: 0 0 36px rgba(249, 115, 22, 0.85), 0 0 65px rgba(14, 165, 233, 0.55);
      }
    }
    .animate-question-glow {
      animation: questionPulse 2.2s ease-in-out infinite;
    }

    /* Hiệu ứng sao bay khi trả lời đúng */
    @keyframes starPop {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      60% { transform: scale(1.3) rotate(120deg); opacity: 1; }
      100% { transform: scale(0.4) translateY(-55px) rotate(220deg); opacity: 0; }
    }
    .star-burst {
      animation: starPop 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Nhịp đèn LED */
    @keyframes ledBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .led-blink {
      animation: ledBlink 1.2s ease-in-out infinite;
    }

    /* Nhấp nháy chốt khóa Toán học trên thanh chắn ở Thử thách 4 */
    @keyframes barrierNudge {
      0%, 80%, 100% { transform: rotate(0deg); }

      92% { transform: rotate(1deg); }
    }
    .barrier-locked-nudge {
      transform-origin: 510px 236px;
      animation: barrierNudge 2.6s ease-in-out infinite;
    }

    /* Canvas pháo giấy toàn màn hình */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 60;
    }
  </style>

  <script>
    /*************************************************************************
     * 1. BỘ ÂM THANH TỔNG HỢP WEB AUDIO API (KHÔNG CẦN TỆP NGOÀI)
     *************************************************************************/
    const SoundFX = {
      ctx: null,
      enabled: true,

      init() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch (e) {
          console.warn('Không thể khởi tạo âm thanh:', e);
        }
      },

      playTone(freq, duration, type = 'sine', volume = 0.14, delay = 0) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(volume, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        } catch (e) {}
      },

      click() {
        this.playTone(540, 0.08, 'triangle', 0.1);
      },

      correct() {
        // Chuỗi hợp âm vui nhộn khi trả lời đúng & mở khóa bộ phận
        this.playTone(523.25, 0.14, 'triangle', 0.15, 0);     // C5
        this.playTone(659.25, 0.14, 'triangle', 0.15, 0.1);   // E5
        this.playTone(783.99, 0.16, 'triangle', 0.16, 0.2);   // G5
        this.playTone(1046.5, 0.34, 'sine', 0.18, 0.3);       // C6
      },

      wrong() {
        // Âm thanh nhẹ, thân thiện khi chọn sai
        this.playTone(300, 0.14, 'sine', 0.12, 0);
        this.playTone(240, 0.22, 'sine', 0.12, 0.12);
      },

      fanfare() {
        // Nhạc chúc mừng hoàn thành 4 thử thách
        const notes = [
          [523.25, 0.14, 0],
          [659.25, 0.14, 0.12],
          [783.99, 0.14, 0.24],
          [1046.5, 0.25, 0.36],
          [783.99, 0.12, 0.56],
          [1046.5, 0.45, 0.68]
        ];
        notes.forEach(([f, d, dl]) => this.playTone(f, d, 'triangle', 0.16, dl));
      }
    };

    function toggleSound() {
      SoundFX.enabled = !SoundFX.enabled;
      document.getElementById('sound-icon').textContent = SoundFX.enabled ? '🔊' : '🔇';
      document.getElementById('sound-label').textContent = SoundFX.enabled ? 'Âm thanh' : 'Đã tắt';
      if (SoundFX.enabled) SoundFX.click();
    }

    function showToast(msg) {
      const box = document.getElementById('toast-box');
      box.textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => box.classList.add('hidden'), 2800);
    }

    function toggleFullscreen() {
      SoundFX.click();
      try {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {
              showToast('Trình duyệt hiện không cho phép bật toàn màn hình trong khung nhúng.');
            });
          } else {
            showToast('Thiết bị không hỗ trợ chế độ toàn màn hình.');
          }
        } else {
          document.exitFullscreen().catch(() => {});
        }
      } catch (e) {
        showToast('Không thể chuyển chế độ toàn màn hình.');
      }
    }

    function triggerStarBurst() {
      const overlay = document.getElementById('star-overlay');
      const colors = ['#fbbf24', '#38bdf8', '#2dd4bf', '#f97316', '#fde047'];
      for (let i = 0; i < 18; i++) {
        const star = document.createElement('div');
        star.textContent = i % 2 === 0 ? '★' : '✦';
        star.className = 'star-burst absolute font-black select-none';
        star.style.left = `${20 + Math.random() * 60}%`;
        star.style.top = `${25 + Math.random() * 45}%`;
        star.style.fontSize = `${18 + Math.random() * 20}px`;
        star.style.color = colors[i % colors.length];
        star.style.animationDelay = `${Math.random() * 0.25}s`;
        overlay.appendChild(star);
        setTimeout(() => star.remove(), 1300);
      }
    }

    let confettiAnimId = null;
    let confettiParticles = [];

    function startConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#0284c7', '#06b6d4', '#14b8a6', '#f59e0b', '#f97316', '#fbbf24', '#ef4444'];
      confettiParticles = Array.from({ length: 110 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.6,
        w: 7 + Math.random() * 7,
        h: 5 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 3.2,
        vy: 2.2 + Math.random() * 3.5,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.14
      }));

      let frames = 0;
      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        confettiParticles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vrot;
          if (p.y > canvas.height + 20 && frames < 200) {
            p.y = -15;
            p.x = Math.random() * canvas.width;
          }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        frames++;
        if (frames < 340) {
          confettiAnimId = requestAnimationFrame(loop);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      cancelAnimationFrame(confettiAnimId);
      loop();
    }

    function stopConfetti() {
      cancelAnimationFrame(confettiAnimId);
      const canvas = document.getElementById('confetti-canvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    window.addEventListener('resize', () => {
      const canvas = document.getElementById('confetti-canvas');
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    });

    /*************************************************************************
     * 5. CẬP NHẬT THANH HUD & ĐIỀU PHỐI CÁC MÀN HÌNH
     *************************************************************************/
    function updateHUD() {
      const hudStats = document.getElementById('hud-stats');
      const restartBtn = document.getElementById('btn-restart-top');
      const progressFill = document.getElementById('progress-fill');
      const progressText = document.getElementById('progress-text');
      const scoreText = document.getElementById('score-text');

      if (state.screen === 'start') {
        hudStats.classList.add('hidden');
        hudStats.classList.remove('flex');
        restartBtn.classList.add('hidden');
        restartBtn.classList.remove('flex');
      } else {
        hudStats.classList.remove('hidden');
        hudStats.classList.add('flex');
        restartBtn.classList.remove('hidden');
        restartBtn.classList.add('flex');
      }

      const pct = (state.completedCount / 4) * 100;
      progressFill.style.width = `${pct}%`;
      progressText.textContent = `${state.completedCount}/4`;
      scoreText.textContent = `${state.score} điểm`;
    }

    function render() {
      updateHUD();
      const app = document.getElementById('app-container');

      if (state.screen === 'start') {
        app.innerHTML = renderStartScreen();
      } else if (state.screen === 'challenge') {
        app.innerHTML = renderChallengeScreen();
      } else if (state.screen === 'complete') {
        app.innerHTML = renderCompleteScreen();
      } else if (state.screen === 'problem') {
        app.innerHTML = renderProblemScreen();
      } else if (state.screen === 'roadmap') {
        app.innerHTML = renderRoadmapScreen();
      }
    }

    /*************************************************************************
     * 6. LOGIC TƯƠNG TÁC: BẮT ĐẦU, CHỌN ĐÁP ÁN, TÍNH ĐIỂM, MỞ KHÓA, CHƠI LẠI
     *************************************************************************/
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function startMission() {
      SoundFX.click();
      state.screen = 'challenge';
      state.currentIdx = 0;
      state.currentAnsweredCorrect = false;
      state.currentHadWrongAttempt = false;
      state.wrongKeysTried = [];
      state.feedbackMessage = '';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectOption(optionKey) {
      if (state.currentAnsweredCorrect) return;
      const ch = CHALLENGES[state.currentIdx];

      if (optionKey === ch.correctKey) {
        // Trả lời ĐÚNG
        SoundFX.correct();
        triggerStarBurst();

        state.currentAnsweredCorrect = true;
        state.unlocked[ch.unlockPartId] = true;
        state.completedCount = Math.max(state.completedCount, state.currentIdx + 1);

        // Cộng 25 điểm nếu trả lời đúng ngay lần đầu tiên
        if (!state.currentHadWrongAttempt) {
          state.score += 25;
        }
        render();
      } else {
        // Trả lời SAI: phát âm thanh nhẹ, không trừ điểm, hiện gợi ý và cho phép trả lời lại
        SoundFX.wrong();
        state.currentHadWrongAttempt = true;
        if (!state.wrongKeysTried.includes(optionKey)) {
          state.wrongKeysTried.push(optionKey);
        }
        state.feedbackMessage = ch.hint;
        render();
      }
    }

    function nextChallenge() {
      SoundFX.click();
      if (state.currentIdx < CHALLENGES.length - 1) {
        state.currentIdx += 1;
        state.currentAnsweredCorrect = false;
        state.currentHadWrongAttempt = false;
        state.wrongKeysTried = [];
        state.feedbackMessage = '';
        render();
      } else {
        state.screen = 'complete';
        render();
        SoundFX.fanfare();
        startConfetti();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goToProblemScreen() {
      SoundFX.click();
      stopConfetti();
      state.screen = 'problem';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goToRoadmapScreen() {
      SoundFX.click();
      state.screen = 'roadmap';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function restartGame() {
      SoundFX.click();
      stopConfetti();
      state = {
        screen: 'start',
        groupName: state.groupName, // giữ lại tên nhóm tiện cho lớp chơi lại
        currentIdx: 0,
        score: 0,
        completedCount: 0,
        unlocked: {
          barrier: false,
          sensor: false,
          controller: false,
          servo: false
        },
        currentAnsweredCorrect: false,
        currentHadWrongAttempt: false,
        wrongKeysTried: [],
        feedbackMessage: ''
      };
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Khởi chạy ứng dụng khi tải xong trang
    window.onload = function () {
      render();
    };
  </script>
</body>
</html>
